name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11, 3.12]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check src/ --output-format=github
    
    - name: Format check with black
      run: |
        pip install black
        black --check src/
    
    - name: Test with pytest
      run: |
        python test_basic.py
    
    - name: Test demo app imports
      run: |
        python -c "import sys; sys.path.append('src'); from src.models.baseline import BaselineAudioToMIDI; print('Import test passed')"
    
    - name: Test device utilities
      run: |
        python -c "import sys; sys.path.append('src'); from src.utils.device import get_device; print(f'Device: {get_device()}')"
